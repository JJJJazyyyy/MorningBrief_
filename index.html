<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 브리핑 — 영업콜용</title>

<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("pretendard.woff2") format("woff2-variations");}

:root{
  --paper:#F2F4F7; --card:#FFFFFF; --sunk:#F7F8FA;
  --ink:#0F1620; --ink2:#3D4959; --ink3:#5E6A7B; --ink4:#98A2AF;
  --line:rgba(15,22,32,.08); --line2:rgba(15,22,32,.15);
  --lift:0 0 0 1px rgba(15,22,32,.055), 0 1px 2px -1px rgba(15,22,32,.06), 0 2px 4px rgba(15,22,32,.035);
  --lift2:0 0 0 1px rgba(15,22,32,.08), 0 2px 4px -1px rgba(15,22,32,.07), 0 6px 14px rgba(15,22,32,.05);
  --blue:#1B64DA; --blue-ink:#134394; --blue-bg:#EAF1FD; --blue-line:rgba(27,100,218,.22);
  --up:#C4302B; --down:#1B64DA;
  --warn:#B3342C; --warn-bg:#FBEEED; --warn-line:rgba(179,52,44,.24);
  --r-s:6px; --r-m:10px; --r-l:14px;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.6; font-weight:400;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; text-wrap:pretty;
  word-break:keep-all; overflow-wrap:break-word}
.wrap{max-width:1180px; margin:0 auto; padding:0 32px 96px}
@media (max-width:640px){.wrap{padding:0 16px 64px}}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:var(--r-s)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

.stalebar{background:var(--warn-bg); color:var(--warn); font-size:12px; font-weight:600;
  padding:8px 16px; text-align:center; letter-spacing:.01em}
.sample{background:var(--blue-bg); border-bottom:1px solid var(--blue-line); color:var(--blue-ink);
  font-size:12px; font-weight:600; padding:8px 16px; text-align:center; letter-spacing:.01em}

/* 머리 */
.head{padding:32px 0 0}
/* 오후·아침 구간 제목 */
.part{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  border-left:5px solid var(--warn); padding-left:14px; margin:0 0 20px}
.part h2{font-size:clamp(23px,2.6vw,29px); font-weight:800; letter-spacing:-.04em; margin:0; color:var(--ink)}
.part em{font-style:normal; font-size:13px; font-weight:600; color:var(--warn)}
.part.am{border-left-color:var(--ink3); margin-top:48px}
.part.am h2{color:var(--ink2)}
.part.am em{color:var(--ink3)}

/* 오늘 오전과 어제를 나란히 */
.duo2{display:flex; gap:24px; flex-wrap:wrap; padding-top:40px; margin-top:40px;
  border-top:1px solid var(--line);
  position:relative; left:50%; transform:translateX(-50%);
  width:min(1640px, calc(100vw - 64px))}
.duo2{align-items:stretch}
.duo2>.col{flex:1 1 440px; min-width:0; display:flex; flex-direction:column}
.duo2>.col>.frail{flex:1 1 auto; display:flex; flex-direction:column}
.duo2>.col>.frail>.fev{flex:1 1 auto}
.duo2>.col>.frail>.fsep{flex:0 0 auto}
.duo2 .pmchart{height:100%}
@media (max-width:1420px){
  .duo2{position:static; left:auto; transform:none; width:auto}
}
.duo2 .part{margin-bottom:14px}
.duo2 .part h2{font-size:clamp(19px,2vw,23px)}
.duo2 .frail{margin:0; padding:0}

/* 오전장 차트 */
.pmchart{background:var(--card); border-radius:var(--r-l); box-shadow:var(--lift);
  padding:20px 22px; display:flex; flex-direction:column}
.pmchart .lg{flex:1 1 auto}
.pmchart .cv{width:100%}
.pmchart .cv svg{display:block; width:100%; height:auto}
.pmchart .lg{margin-top:14px; border-top:1px solid var(--line2); padding-top:6px;
  display:flex; flex-direction:column; justify-content:space-around}
.pmchart .lg div.r{display:flex; gap:12px; align-items:center; padding:clamp(9px,1vw,13px) 0}
.pmchart .lg div.r + div.r{border-top:1px solid var(--line)}
.pmchart .lg k{flex:0 0 19px; height:19px; border-radius:50%; border:1.2px solid currentColor;
  font-size:11px; font-weight:500; display:inline-flex; align-items:center;
  justify-content:center; line-height:1; align-self:center}
.pmchart .lg k:empty{border:0}
.pmchart .lg t{flex:0 0 clamp(50px,4.5vw,64px); font-size:clamp(14px,1.3vw,17px);
  font-weight:800; color:var(--ink); letter-spacing:-.02em}
.pmchart .lg p{margin:0; font-size:clamp(14px,1.3vw,17px); line-height:1.5; color:var(--ink2)}
.pmchart .now{margin-top:10px; padding-top:10px; border-top:1px solid var(--line2);
  font-size:13px; color:var(--ink2)}
.pmchart .now b{font-size:16px; font-weight:700}
.pmchart .now s{text-decoration:none; font-size:11.5px; color:var(--ink3); margin-left:4px}
.pmclose{background:var(--card); border-radius:var(--r-m); box-shadow:var(--lift);
  padding:14px 16px; margin-bottom:8px}
.pmclose b{display:block; font-size:11px; font-weight:700; letter-spacing:.12em;
  color:var(--warn); margin-bottom:5px}
.pmclose p{margin:0; font-size:15px; line-height:1.6; color:var(--ink)}
.brand{display:block; height:32px; width:auto}
.dateline{font-size:clamp(22px,2.5vw,32px); line-height:1.18; font-weight:800;
  color:var(--blue); letter-spacing:-.042em; margin:26px 0 22px}
.sg{display:inline-block}
.headline{font-size:clamp(34px,4.2vw,52px); line-height:1.18; font-weight:800;
  margin:0 0 18px; letter-spacing:-.042em; max-width:19ch}

.m i{display:block; font-style:normal; font-size:24px; font-weight:600; letter-spacing:-.03em; line-height:1.1}
.m u{display:block; text-decoration:none; font-size:12px; font-weight:500; margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)} .flat,.na{color:var(--ink4)}

/* 섹션 */
.blk{padding-top:40px; margin-top:40px; border-top:1px solid var(--line)}
.sh{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 4px}
.sh h2{font-size:clamp(26px,2.9vw,36px); font-weight:800; letter-spacing:-.04em; margin:0; line-height:1.2}
.sh em{font-style:normal; font-size:clamp(14px,1.35vw,17px); color:var(--ink2); font-weight:500;
  letter-spacing:-.015em}

.blk.hot{max-width:880px; margin-left:auto; margin-right:auto}
.fev{display:flex; align-items:center; gap:clamp(12px,1.6vw,22px);

.fev.key{box-shadow:var(--lift2)}
.fev time{flex:0 0 auto; min-width:clamp(64px,5.5vw,86px);

  letter-spacing:-.02em; line-height:1.4; white-space:nowrap}
.fev p{margin:0; flex:1 1 auto; font-size:clamp(14px,1.35vw,17px);
  line-height:1.45; color:var(--ink2); letter-spacing:-.018em}
/* 박스 사이를 잇는 갈매기 화살표 */
.fsep{position:relative; height:clamp(16px,1.6vw,22px)}
.fsep::after{content:""; position:absolute; left:50%; top:50%;

  border-right:1.5px solid var(--ink4); border-bottom:1.5px solid var(--ink4);
  transform:translate(-50%,-70%) rotate(45deg)}
@media (max-width:640px){
  .fev{flex-direction:column; align-items:flex-start; gap:6px; padding:15px 16px}
  .fev time{min-width:0}
}

.ch k{display:block; font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:.1em; margin-bottom:9px}

.csep{flex:0 0 24px; display:flex; align-items:center; justify-content:center; color:var(--ink4); font-size:15px}

.chclose{margin-top:16px; padding-left:16px; border-left:2px solid var(--blue); border-radius:0;
  font-size:15px; line-height:1.68; color:var(--ink2); max-width:62ch}
.chclose b{display:block; font-size:11px; color:var(--blue); font-weight:600; letter-spacing:.12em; margin-bottom:6px}

/* 항목 */

.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1420px){
  .blk.spread>.grid{position:static; left:auto; transform:none; width:auto}

<script>
window.renderBrief = function(D){
  /* 따옴표 안쪽, 숫자+단위는 줄바꿈으로 끊기지 않게 묶는다 */
  var NB = '\u00A0';
  var glue = function(s){
    return String(s==null?'':s)
      .replace(/'([^']{1,60})'/g, function(m,p){ return "'"+p.replace(/ /g,NB)+"'"; })
      .replace(/“([^”]{1,60})”/g, function(m,p){ return '“'+p.replace(/ /g,NB)+'”'; })
      .replace(/(\d[\d,.]*)\s+(원|달러|포인트|배럴|만원|억원|조원|퍼센트|거래일)/g, '$1'+NB+'$2')
      .replace(/([가-힣A-Za-z0-9)\]%]) (것|게|수|점|중|뿐|만|때|후|전|말)([\s.,]|$)/g, '$1'+NB+'$2$3');
  };
  var SEG = function(s){
    var t = glue(String(s==null?'':s));
    var out = [], buf = '', i, c, nx;
    for (i = 0; i < t.length; i++){
      c = t.charAt(i); nx = t.charAt(i+1);
      if (c === '|'){ if (buf.trim()) out.push(buf.trim()); buf = ''; continue; }
      buf += c;
      if ((c === '.' || c === ',' || c === '·' || c === '?' || c === '!') && nx === ' '){
        out.push(buf.trim()); buf = ''; i++;
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out.map(function(p){ return '<span class="sg">' + esc(p) + '</span>'; }).join(' ');
  };
  var esc = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var FLAG = {
    kr:'<svg width="15" height="10" viewBox="0 0 30 20" aria-hidden="true">'
      +'<rect width="30" height="20" fill="#fff" stroke="#D3D9DC" stroke-width="0.5"/>'

      +'<rect width="13" height="11.5" fill="#1D3A8A"/>'
      +'<rect width="30" height="20" fill="none" stroke="#D3D9DC" stroke-width="0.5"/></svg>'

  var sh = function(title, sub){
    return '<div class="sh"><h2>' + esc(title) + '</h2>'

  var buildSections = function(list){
    var h = '';
  (list || []).forEach(function(sec){
    var items = (sec.items || []).slice().sort(function(a,b){ return (b.stars||0) - (a.stars||0); });
    if (sec.hot && !items.length) return;
    /* 4~5개는 한 줄, 6개 이상은 절반씩 두 줄. 최대 5열 */
    var cols = items.length <= 5 ? items.length : Math.min(5, Math.ceil(items.length / 2));
    var spread = sec.id === 'hold' && items.length >= 4 && cols >= 4;
    h += '<section class="blk' + (sec.hot ? ' hot' : '') + (spread ? ' spread' : '') + '">'
       + sh(sec.title, sec.desc);
    if (!items.length) h += '<div class="empty">오늘 이 칸에 담을 항목이 없습니다.</div>';
    h += '<div class="grid' + (spread ? ' c' + cols : '') + '">';
    items.forEach(function(it){
      var n = Math.max(1, Math.min(3, it.stars || 1));
      /* 별점은 계좌 손익 순서, lead 는 어제 성과로 정한 오늘 꺼낼 종목 */
      var lead = (sec.id === 'hold' && it.lead === true);
      var right = '';
      if (it.upcoming) right = '<span class="soonchip">' + esc(it.upcoming) + '</span>';
      else if (sec.id === 'hold') right = lead

      h += '<article class="it' + (lead ? ' lead' : '') + '"><div class="starrow">'

         + '<h3 class="t">' + SEG(it.t) + '</h3><div class="say">' + SEG(it.s) + '</div>';
      if (it.avg && it.avg.buy){
        var sgn = function(r){ var c = String(r).charAt(0); return (c === '−' || c === '-') ? 'down' : 'up'; };
        h += '<div class="duo">';
        if (it.avg.day){
          h += '<div><k>' + esc(it.avg.dayLabel || '어제 하루') + '</k>'

        }
        h += '<div class="wide"><k>추천가 ' + esc(it.avg.buy) + ' 대비</k>'
           + '<v class="' + sgn(it.avg.rate) + '">' + esc(it.avg.rate) + '</v></div></div>';
      }
      if (it.easy){
        var paras = String(it.easy).split('\n').filter(function(p){ return p.trim(); })
                    .map(function(p){ return '<p>' + SEG(p) + '</p>'; }).join('');
        h += '<details open>'
           + '<summary>고객에게 이렇게 설명하세요</summary>'
           + '<div class="easy">' + paras + '</div></details>';
      }
      var TONE = {'경계':'warn','유지':'hold','기회':'chance'};
      if (it.stance && it.stance.text){
        h += '<div class="stance ' + (TONE[it.stance.tone] || 'hold') + '">'
           + '<k>지금 포지션은 · ' + esc(it.stance.tone || '유지') + '</k>'
           + '<p>' + SEG(it.stance.text) + '</p></div>';
      }
      if (it.next && it.next.text){
        h += '<div class="next"><k>그래서 만나서 · ' + esc(it.next.type || '점검') + '</k>'
           + '<p>' + SEG(it.next.text) + '</p></div>';
      }
      h += '<div class="tags">';
      (it.tags || []).forEach(function(tg){
        var kind = ['focus','surge'].indexOf(tg.kind) >= 0 ? ' ' + tg.kind : '';
        h += '<span class="tag' + kind + '">' + esc(tg.label) + '</span>';
      });
      h += '<span class="day">' + esc(it.date || '') + '</span></div>';
      if (it.url && /^https:\/\//.test(it.url))
        h += '<a class="src" href="' + esc(it.url) + '" target="_blank" rel="noopener">기사 원문</a>';
      h += '</article>';
    });
    h += '</div></section>';
  });

    return h;
  };

  /* 본문은 아침·오후가 같은 틀을 쓴다 */
  var buildBody = function(D){

      var dir = ['up','down','flat','na'].indexOf(m.dir) >= 0 ? m.dir : 'flat';
      h += '<div class="m"><b>' + (FLAG[m.flag] || '') + esc(m.k) + '</b>'
         + '<i>' + esc(m.v) + '</i><u class="' + dir + '">' + esc(m.d) + '</u></div>';
    });
    h += '</div>';
  }

  var T = D.timeline;
  if (T && T.items && T.items.length){
    var tl = '<div class="frail">';
    T.items.forEach(function(e, i){
      if (i) tl += '<div class="fsep"></div>';
      var tone = ['up','down','flat','key'].indexOf(e.tone) >= 0 ? e.tone : 'flat';
      tl += '<div class="fev ' + tone + '"><time>' + esc(e.time) + '</time><p>' + SEG(e.text) + '</p></div>';
    });
    tl += '</div>';

    if (D.chart){
      /* 오늘 오전 차트와 어제 타임라인을 나란히 */
      h += '<div class="blk duo2">'
         + '<div class="col"><div class="part"><h2>오늘 오전</h2>'
         +   (D.chartAt ? '<em>' + esc(D.chartAt) + ' 업데이트</em>' : '') + '</div>'
         +   pmChart(D.chart) + '</div>'
         + '<div class="col"><div class="part am"><h2>' + esc(T.title || '어제 무슨 일이 있었나') + '</h2>'
         +   (T.sub ? '<em>' + esc(T.sub) + '</em>' : '') + '</div>'
         +   tl + '</div></div>';
    } else {
      h += '<section class="blk narrow">' + sh(T.title || '어제 무슨 일이 있었나', T.sub || '') + tl + '</section>';
    }

    if (T.chain && T.chain.length){
      h += '<section class="blk narrow">' + sh(T.chainTitle || '콜 열자마자 이 순서로', T.chainSub || '');

        if (i) h += '<div class="csep">›</div>';
        h += '<div class="ch' + (i === T.chain.length - 1 ? ' end' : '') + '">'
           + '<k>' + esc(c.k) + '</k><p>' + SEG(c.text) + '</p></div>';
      });
      h += '</div>';
      if (T.close && T.close.text){
        h += '<div class="chclose"><b>' + esc(T.close.label || '그래서 오늘') + '</b>' + esc(glue(T.close.text)) + '</div>';
      }
      h += '</section>';
    }
  }

  h += buildSections(D.sections);

  if (D.cal && D.cal.length){
    h += '<section class="blk cal">' + sh(D.calTitle || '다시 전화할 명분', D.calSub || '') + '<ul>';
    D.cal.forEach(function(c){
      h += '<li' + (c.hi ? ' class="hi"' : '') + '><b>' + esc(c.day) + '</b><span><i>' + esc(c.text) + '</i>'
         + (c.use ? '<u class="use">' + esc(c.use) + '</u>' : '') + '</span></li>';
    });
    h += '</ul></section>';
  }

  h += '<div class="foot">' + esc(D.legend || '') + '<br>' + esc(D.foot || '') + '</div>';
  return h;
  };

  var part = function(label, at, am){
    return '<div class="part' + (am ? ' am' : '') + '"><h2>' + label + '</h2>'
         + (at ? '<em>' + esc(at) + ' 업데이트</em>' : '') + '</div>';
  };

  /* 오전장 지수 차트 — 전일 종가를 기준선으로 위는 빨강 아래는 파랑 */
  var pmChart = function(C){
    if (!C || !C.points || C.points.length < 2) return '';
    var W = 340, H = 176, L = 18, R = 322, T = 14, B = 112;
    var vals = C.points.map(function(p){ return p.v; }).concat([C.base]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo) * 0.25 || 1; lo -= pad; hi += pad;
    var X = function(i){ return L + (R - L) * (i / (C.points.length - 1)); };
    var Y = function(v){ return B - (B - T) * ((v - lo) / (hi - lo)); };
    var yb = Y(C.base);
    var line = C.points.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + R + ',' + yb.toFixed(1) + ' L' + L + ',' + yb.toFixed(1) + ' Z';
    var u = 'u' + Math.random().toString(36).slice(2, 7);
    var dots = '', rows = '';
    (C.marks || []).forEach(function(m, n){
      var i = m.i, v = C.points[i] ? C.points[i].v : C.base;
      var up = v >= C.base, col = up ? 'var(--up)' : 'var(--down)';
      /* 차트 면에는 작은 점만, 번호 동그라미는 시간축 아래로 내린다 */
      var bx = X(i).toFixed(1), by = Y(v).toFixed(1), ny = 140;
      dots += '<line x1="' + bx + '" y1="' + by + '" x2="' + bx + '" y2="' + (ny - 10) + '" stroke="var(--line2)" stroke-width="1"/>'
            + '<circle cx="' + bx + '" cy="' + by + '" r="3.2" fill="' + col + '"/>'
            + '<circle cx="' + bx + '" cy="' + ny + '" r="8" fill="var(--card)" stroke="' + col + '" stroke-width="1.2"/>'
            + '<text x="' + bx + '" y="' + (ny + 3.3) + '" text-anchor="middle" font-size="9.5" font-weight="500" fill="' + col + '">' + (n + 1) + '</text>';
      rows += '<div class="r"><k style="color:' + col + '">' + (n + 1) + '</k><t>' + esc(m.time) + '</t><p>' + SEG(m.text) + '</p></div>';
    });
    (C.tail || []).forEach(function(m){
      rows += '<div class="r"><k></k><t>' + esc(m.time) + '</t><p>' + SEG(m.text) + '</p></div>';
    });
    var nowUp = C.now && String(C.now.d).charAt(0) !== '−' && String(C.now.d).charAt(0) !== '-';
    return '<div class="pmchart"><div class="cv">'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>오전장 지수 흐름</title><defs>'
      + '<linearGradient id="gu' + u + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--up)" stop-opacity=".30"/><stop offset="100%" stop-color="var(--up)" stop-opacity="0"/></linearGradient>'
      + '<linearGradient id="gd' + u + '" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="var(--down)" stop-opacity=".30"/><stop offset="100%" stop-color="var(--down)" stop-opacity="0"/></linearGradient>'
      + '<clipPath id="cu' + u + '"><rect x="0" y="0" width="' + W + '" height="' + yb.toFixed(1) + '"/></clipPath>'
      + '<clipPath id="cd' + u + '"><rect x="0" y="' + yb.toFixed(1) + '" width="' + W + '" height="' + (H - yb).toFixed(1) + '"/></clipPath></defs>'
      + '<path d="' + area + '" fill="url(#gu' + u + ')" clip-path="url(#cu' + u + ')"/>'
      + '<path d="' + area + '" fill="url(#gd' + u + ')" clip-path="url(#cd' + u + ')"/>'
      + '<line x1="' + L + '" y1="' + yb.toFixed(1) + '" x2="' + R + '" y2="' + yb.toFixed(1) + '" stroke="var(--rail)" stroke-width="1" stroke-dasharray="4 3"/>'
      + '<path d="' + line + '" fill="none" stroke="var(--up)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cu' + u + ')"/>'
      + '<path d="' + line + '" fill="none" stroke="var(--down)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cd' + u + ')"/>'
      + dots
      + '<text x="' + L + '" y="168" text-anchor="start" font-size="10.5" fill="var(--ink3)">' + esc(C.points[0].t || '') + '</text>'
      + '<text x="' + R + '" y="168" text-anchor="end" font-size="10.5" fill="var(--ink3)">' + esc(C.points[C.points.length - 1].t || '') + '</text>'
      + '<text x="' + (R + 4) + '" y="' + (yb - 4).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--ink3)">' + esc(C.baseLabel || '') + '</text>'
      + '</svg></div><div class="lg">' + rows
      + (C.now ? '<div class="now">' + esc(C.now.k || '코스피') + ' <b class="' + (nowUp ? 'up' : 'down') + '">' + esc(C.now.v) + '</b> '
          + '<span class="' + (nowUp ? 'up' : 'down') + '" style="font-weight:700">' + esc(C.now.d) + '</span><s>장중</s></div>' : '')
      + '</div></div>';
  };

  var out;
  if (D.pm){
    /* 오후 데이터는 아침 데이터 위에 덮인다. 헤드라인은 하나로 합쳐진다 */
    var P = {}, k;
    for (k in D) if (k !== 'pm') P[k] = D[k];
    for (k in D.pm) if (k !== 'sections' && k !== 'at') P[k] = D.pm[k];
    P.chartAt = D.pm.at;
    if (D.pm.sections && D.pm.sections.length){
      var byId = {}, order = [];
      (D.sections || []).forEach(function(s){ byId[s.id] = s; order.push(s.id); });
      D.pm.sections.forEach(function(s){
        if (!byId[s.id]) order.push(s.id);
        byId[s.id] = s;
      });
      P.sections = order.map(function(id){ return byId[id]; });
    }
    out = head + buildBody(P);
  } else {
    out = head + buildBody(D);
  }
  document.getElementById('APP').innerHTML = out + '</div>';
};

/* ── 데이터 가져오기 ──────────────────────────────────────────
   1순위: 앱스 스크립트(시트)   2순위: 브라우저에 저장된 마지막 것
   3순위: 파일에 박혀 있는 것    → 어느 경우에도 빈 화면은 안 나온다 */
(function(){
  var SRC = 'https://script.google.com/macros/s/AKfycbxx1pzOfVXGcuWCHKOYMv04BrXzaQlXAnT2xAIy8hBlRgLHz67z31GfiHHxCyd_FfJI/exec';
  var KEY = 'brief:last';
  var seed = null;
  try { seed = JSON.parse(document.getElementById('D').textContent); } catch (e) {}

  var show = function(D, stale){
    if (!D) return;
    window.renderBrief(D);
    if (stale){
      var b = document.createElement('div');
      b.className = 'stalebar';
      b.textContent = '최신 데이터를 불러오지 못해 마지막으로 받은 내용을 보여드립니다';
      document.body.insertBefore(b, document.body.firstChild);
    }
  };

  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

  var timer = setTimeout(function(){ fail(); }, 6000);
  var done = false;
  function fail(){
    if (done) return; done = true; clearTimeout(timer);
    show(cached || seed, true);
  }

  /* 앱스 스크립트는 교차 도메인 요청을 허용하지 않아 fetch로는 못 읽는다.
     script 태그로 불러오는 JSONP 방식은 그 제약을 받지 않는다. */
  var CB = 'briefCb' + Date.now();
  window[CB] = function(j){
    if (done) return;
    if (!j || !j.ok || !j.data) return fail();
    done = true; clearTimeout(timer);
    try { localStorage.setItem(KEY, JSON.stringify(j.data)); } catch (e) {}
    show(j.data, false);
    try { delete window[CB]; } catch (e) {}
  };
  var sc = document.createElement('script');
  sc.src = SRC + '?callback=' + CB + '&t=' + Date.now();
  sc.onerror = fail;
  document.head.appendChild(sc);
})();
</script>
</body>
